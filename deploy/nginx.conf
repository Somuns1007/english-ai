# 用途：站点配置模板，通过主 nginx.conf 的 http {} include 引入，不要替换整个主配置。
# 替换所有域名、证书及 /opt/english-ai 路径后，用 nginx -t 检查，再 reload。
# limit_req_zone 只能位于 http {}，不能放进 server {}。完整层级示例：
# http {
#     include /etc/nginx/mime.types;
#     default_type application/octet-stream;
#     include /etc/nginx/conf.d/english-ai.conf;
# }
# 将本文件安装到上述 english-ai.conf 后，下面这一条即位于 http 上下文。
# 若选择把它放到主 http {}，须删除本文件的同名定义，避免重复；仅启用一份站点配置。
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gallery_upload_limit:10m rate=10r/m;

server {
    listen 80;
    server_name 你的域名;
    # 证书签发/自动续期的 HTTP-01 验证目录，其余流量跳转 HTTPS。
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 你的域名;

    ssl_certificate     /etc/letsencrypt/live/你的域名/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/你的域名/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /opt/english-ai/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 登录/注册单独限速，含尾斜杠；不要把 10r/m 用于全部 API。
    # 听力心跳/行为事件本身可能超过 10 次/分钟，全局限流会破坏训练。
    # 共享出口 IP（校园网）可能误伤，应在试运行期间监测 429。
    location ~ ^/api/auth/(login|register)/?$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
    }

    # Gallery files are private. Never add a static alias for uploads/gallery.
    location = /api/gallery/upload {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 11m;
        client_body_timeout 30s;
        limit_req zone=gallery_upload_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_read_timeout 60s;
    }

    location /api/ {
        # 不加 URI 后缀，保持 /api/... 原始路径传给 FastAPI。
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
        # 写作批改可能超过默认 60 秒；不改变 FastAPI 的业务逻辑。
        proxy_read_timeout 180s;
    }
}
